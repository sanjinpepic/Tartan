name: Release

# A push to main that changes apk/ makes a release of the APK there (apk/tartan-<version>.apk),
# tagged v<version>. Obtainium reads the releases.
on:
  push:
    branches: [main]
    paths: ["apk/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the APK
        run: |
          APK=$(ls apk/tartan-*.apk | head -1)
          test -n "$APK" || { echo "No apk/tartan-<version>.apk"; exit 1; }
          V=$(basename "$APK" .apk); V="${V#tartan-}"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Tartan ${{ env.V }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK }}
          body_path: notes.md
          make_latest: true
